<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditorías de Maquinaria — Estancia San Luis</title>
<style>
  :root{
    --bg:#f4f6f8; --primary:#1d4e5f; --primary-light:#2c7a92; --text:#1f2937; --text-soft:#6b7280; --border:#e2e6ea;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header.topbar{
    background:linear-gradient(120deg,var(--primary) 0%,var(--primary-light) 100%);
    color:#fff; padding:16px 24px 0; display:flex; flex-direction:column; gap:12px;
  }
  header.topbar .titulo{font-size:19px; font-weight:600;}
  header.topbar .sub{font-size:12px; opacity:.85; margin-top:2px;}
  .tabs{display:flex; gap:4px;}
  .tab{
    padding:10px 20px; border:none; background:rgba(255,255,255,.12); color:#fff; font-size:13.5px; font-weight:600;
    cursor:pointer; border-radius:8px 8px 0 0; opacity:.75;
  }
  .tab.activa{background:var(--bg); color:var(--primary); opacity:1;}
  .tab:disabled{cursor:default; opacity:.4;}
  iframe{width:100%; height:calc(100vh - 84px); border:none; display:block; background:var(--bg);}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <div class="titulo">🚜 Auditorías de Maquinaria</div>
    <div class="sub">Estancia San Luis — elegí la labor</div>
  </div>
  <div class="tabs">
    <button class="tab activa" data-src="cosecha.html" onclick="cambiar(this)">🌾 Cosecha</button>
    <button class="tab" data-src="siembra.html" onclick="cambiar(this)">🌱 Siembra</button>
    <button class="tab" data-src="fertilizacion.html" onclick="cambiar(this)">🧪 Fertilización</button>
  </div>
</header>

<iframe id="marco" src="cosecha.html" title="Dashboard"></iframe>

<script>
function cambiar(btn){
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('activa'));
  btn.classList.add('activa');
  document.getElementById('marco').src = btn.dataset.src;
}
</script>

</body>
</html>
